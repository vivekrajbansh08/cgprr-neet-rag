name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run python scripts/check_golden_lock.py
      - run: uv run pytest -q

  compose-db:
    # Validates docker-compose.yml (pgvector/pgvector:0.8.7-pg18), the migrations and the roles.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create .env with throwaway passwords
        run: |
          sed -e "s/=change-me/=ci-$(openssl rand -hex 12)/" .env.example > .env
      - run: docker compose up -d --wait postgres
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: make migrate
      - run: make migrate   # second run must be a no-op
      - run: scripts/check_roles.sh
      - name: 003_core created the tables and views; neet_reader can read them
        run: |
          set -a; source .env; set +a
          PGPASSWORD="$POSTGRES_PASSWORD" psql -X -v ON_ERROR_STOP=1 -h localhost -p "$POSTGRES_HOST_PORT" \
            -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "
              SELECT count(*) FROM information_schema.tables WHERE table_schema = 'neet'
                AND table_name IN ('source_file','institute','allotment','seat_matrix','chunk','ingest_run',
                                   'closing_rank','closing_rank_cw_nri')" | grep -qx 8
          PGPASSWORD="$NEET_READER_PASSWORD" psql -X -v ON_ERROR_STOP=1 -h localhost -p "$POSTGRES_HOST_PORT" \
            -U neet_reader -d "$POSTGRES_DB" \
            -c "SELECT count(*) FROM neet.closing_rank" -c "SELECT count(*) FROM neet.closing_rank_cw_nri" \
            -c "SELECT count(*) FROM neet.chunk" -c "SELECT count(*) FROM neet.seat_matrix"
      - if: always()
        run: docker compose logs postgres
