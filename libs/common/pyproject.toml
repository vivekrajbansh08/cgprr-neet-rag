[project]
name = "neet-common"
version = "0.1.0"
description = "Shared config, DB access, pydantic schemas and the OpenAI-compatible LLM client."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neet_common"]
