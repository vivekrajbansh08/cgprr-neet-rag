[project]
name = "cgprr-neet-rag"
version = "0.1.0"
description = "Private, locally hosted RAG assistant for NEET counselling, plus a college predictor (Track A)."
requires-python = ">=3.11"
dependencies = [
    "neet-common",
    "neet-mccparse",
    "neet-retrieval",
    "neet-answer",
    "neet-predictor",
    "neet-ui",
    "neet-ingest",
    "neet-eval",
    "neet-bench",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pre-commit>=4.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*", "jobs/*"]

[tool.uv.sources]
neet-common = { workspace = true }
neet-mccparse = { workspace = true }
neet-retrieval = { workspace = true }
neet-answer = { workspace = true }
neet-predictor = { workspace = true }
neet-ui = { workspace = true }
neet-ingest = { workspace = true }
neet-eval = { workspace = true }
neet-bench = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data", "eval/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ANN", "PTH", "TID"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]
"**/tests/**" = ["ANN", "S"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests", "libs", "services", "jobs"]
addopts = "-ra --import-mode=importlib"
