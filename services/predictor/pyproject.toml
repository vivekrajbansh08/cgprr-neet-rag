[project]
name = "neet-predictor"
version = "0.1.0"
description = "Track A college predictor: options from SQL only; the LLM only explains."
requires-python = ">=3.11"
dependencies = [
    "neet-common",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neet_predictor"]
