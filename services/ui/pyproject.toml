[project]
name = "neet-ui"
version = "0.1.0"
description = "Thin Streamlit front end."
requires-python = ">=3.11"
dependencies = [
    "neet-common",
    "streamlit>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neet_ui"]
