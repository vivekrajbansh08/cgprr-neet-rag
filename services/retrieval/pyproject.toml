[project]
name = "neet-retrieval"
version = "0.1.0"
description = "Hybrid search (Postgres FTS + pgvector, fused with RRF) and structured SQL lookup."
requires-python = ">=3.11"
dependencies = [
    "neet-common",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neet_retrieval"]
