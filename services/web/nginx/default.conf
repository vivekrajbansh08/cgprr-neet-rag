# Static UI + same-origin proxies to the services running natively on the host.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/answer/ {
        proxy_pass http://host.docker.internal:8002/;
        proxy_read_timeout 180s;
        proxy_set_header Host 127.0.0.1;
    }

    location /api/predictor/ {
        proxy_pass http://host.docker.internal:8003/;
        proxy_read_timeout 180s;
        proxy_set_header Host 127.0.0.1;
    }

    # Read-only evidence files, mounted from the repo (data/raw/MANIFEST.md, eval/results/score_table.md).
    location = /evidence/manifest.md {
        alias /evidence/MANIFEST.md;
        default_type "text/markdown; charset=utf-8";
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control no-store;
        limit_except GET { deny all; }
    }
    location = /evidence/score_table.md {
        alias /evidence/score_table.md;
        default_type "text/markdown; charset=utf-8";
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control no-store;
        limit_except GET { deny all; }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
