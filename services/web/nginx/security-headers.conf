# Included at server level AND in every location that sets its own add_header (nginx drops
# inherited add_header directives in such locations).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
# script-src hash = sha256 of the inline theme script in index.html. It MUST change whenever that
# script changes; `npm run build` runs scripts/check-csp.mjs, which fails if the two disagree.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-3r1UmMUipdf38y3wXCsy1/7lJbp9jLqe/FIYveUvUTA='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
