[project]
name = "neet-eval"
version = "0.1.0"
description = "CLI: run the locked eval set and write eval/results/score_table.md."
requires-python = ">=3.11"
dependencies = [
    "neet-common",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neet_eval"]
