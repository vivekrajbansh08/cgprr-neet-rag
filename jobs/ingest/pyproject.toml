[project]
name = "neet-ingest"
version = "0.1.0"
description = "CLI: raw MCC PDFs to Postgres with provenance (file, sha256, page, row)."
requires-python = ">=3.11"
dependencies = [
    "neet-common",
    "neet-mccparse",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neet_ingest"]
