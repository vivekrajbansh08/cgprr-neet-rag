[project]
name = "neet-bench"
version = "0.1.0"
description = "CLI: latency and tokens-per-second benchmark against an OpenAI-compatible endpoint."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "neet-common",
    "neet-ingest",
    "pyyaml>=6.0.3",
]

[tool.uv.sources]
neet-common = { workspace = true }
neet-ingest = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neet_bench"]
