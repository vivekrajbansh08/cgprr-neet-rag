[project]
name = "neet-bench"
version = "0.1.0"
description = "CLI: latency and tokens-per-second benchmark against an OpenAI-compatible endpoint."
requires-python = ">=3.11"
dependencies = [
    "neet-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neet_bench"]
