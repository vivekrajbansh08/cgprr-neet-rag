# For reviewers: Postgres 18 + pgvector in Docker. Ollama runs natively (Docker on macOS cannot use
# the Apple GPU). Services read LLM_BASE_URL from .env, so Ollama and vLLM are interchangeable.
#
# Development on the author's Mac uses Homebrew postgresql@18 + pgvector 0.8.7 instead (see README,
# "Running without Docker"). This file is validated in CI (.github/workflows/ci.yml), not on that Mac.
name: neet-rag

services:
  postgres:
    # Tag checked against the Docker Hub registry API (linux/amd64 + linux/arm64). pgvector 0.8.7
    # matches the dev Mac; the image ships PG 18.7, dev runs 18.4 (same major version).
    image: pgvector/pgvector:0.8.7-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-neet}
    ports:
      # Host port is configurable because a local Postgres may already own 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # PG 18 images declare VOLUME /var/lib/postgresql (PGDATA=/var/lib/postgresql/18/docker).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Web UI (production build behind nginx): `docker compose --profile web up -d --build web`.
  # The answer (:8002) and predictor (:8003) services run natively on the host; nginx proxies to them.
  # REQUIRES Docker Desktop (macOS/Windows): there, host.docker.internal reaches services bound to the
  # host's 127.0.0.1. On Linux it does not (host-gateway is the bridge IP, and the services bind to
  # 127.0.0.1 only). On Linux use `make web` (Vite dev server), or run this image with
  # `network_mode: host`, `listen 127.0.0.1:8080` and proxy_pass to 127.0.0.1. Never widen the binds.
  web:
    profiles: ["web"]
    build: ./services/web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/raw/MANIFEST.md:/evidence/MANIFEST.md:ro
      - ./eval/results/score_table.md:/evidence/score_table.md:ro

